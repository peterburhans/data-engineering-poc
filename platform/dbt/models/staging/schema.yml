version: 2

sources:
  - name: core_raw
    schema: core_raw
    tables:
      - name: smart_meter_events
        columns:
          - name: event_id
            data_tests: [not_null, unique]
          - name: meter_id
            data_tests:
              - not_null
              - dbt_utils.not_empty_string
          - name: us_region
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [Northeast, Midwest, South, West]
          - name: state_code
            data_tests: [not_null]
          - name: event_time
            data_tests: [not_null]
          - name: energy_kwh
            data_tests:
              - not_null
              - dbt_utils.accepted_range:
                  arguments:
                    min_value: 0
                    inclusive: true
          - name: voltage_v
            data_tests:
              - not_null
              - dbt_utils.accepted_range:
                  arguments:
                    min_value: 0
                    inclusive: false
          - name: current_a
            data_tests:
              - not_null
              - dbt_utils.accepted_range:
                  arguments:
                    min_value: 0
                    inclusive: true
          - name: power_factor
            data_tests:
              - not_null
              - dbt_utils.accepted_range:
                  arguments:
                    min_value: 0
                    max_value: 1
                    inclusive: true
          - name: schema_version
            data_tests:
              - not_null
              - dbt_utils.not_empty_string
      - name: electricity_prices
        columns:
          - name: price_id
            data_tests: [not_null, unique]
          - name: us_region
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [Northeast, Midwest, South, West]
          - name: state_code
            data_tests: [not_null]
          - name: effective_from
            data_tests: [not_null]
          - name: price_per_kwh
            data_tests:
              - not_null
              - dbt_utils.accepted_range:
                  arguments:
                    min_value: 0
                    inclusive: true

models:
  - name: stg_meter_readings
    description: Data Vault staging view containing source-backed smart-meter records only.
    columns:
      - name: hk_meter_h
        data_tests: [not_null]
      - name: hk_reading_h
        data_tests: [not_null]
  - name: stg_electricity_prices
    description: Validated, effective-dated US regional electricity prices.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [state_code, effective_from]
