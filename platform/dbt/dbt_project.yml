name: smart_meter
version: 1.0.0
config-version: 2
profile: smart_meter
model-paths: ["models"]
test-paths: ["tests"]
clean-targets: ["target", "dbt_packages"]
packages-install-path: /opt/airflow/dbt_packages
models:
  smart_meter:
    staging:
      +materialized: view
      +schema: staging
    rdv:
      +materialized: incremental
      +schema: rdv
    business_vault:
      +materialized: table
      +schema: business_vault
    information:
      +materialized: view
      +schema: information
    presentation:
      +materialized: table
      +schema: presentation
    semantic:
      +materialized: table
      +schema: semantic
vars:
  datavault4dbt.first_day_of_week:
    postgres: 1
  datavault4dbt:
    hash: MD5
    hash_datatype: VARCHAR(32)
    hashkey_input_case_sensitive: false
    ldts_alias: load_datetime
    rsrc_alias: record_source
